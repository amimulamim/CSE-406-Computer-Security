version: '3.8'

services:
  flask-app:
    build: .
    image: amimulamim/side-channel-attack:latest

    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      # Mount volumes for persistent data if needed
      - ./static/heatmaps:/app/static/heatmaps
    restart: unless-stopped
